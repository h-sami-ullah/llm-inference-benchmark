[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Benchmark LLM inference optimizations (HuggingFace + vLLM OpenAI server)"
readme = "README.md"
requires-python = ">=3.11"

# Light, portable dependencies only. GPU/CUDA packages (torch, vllm, ...) are
# intentionally NOT here: they need platform-specific CUDA wheels and would
# otherwise make `uv sync` / `pip install -e .` try to build them from source.
dependencies = [
    "requests",
    "openai",
    "aiohttp",
    "tqdm",
    "pandas",
    "numpy",
    "matplotlib",
    "nvidia-ml-py3",
    "huggingface-hub",
]

[project.optional-dependencies]
# Install with a CUDA-capable PyTorch index, e.g.:
#   uv sync --extra gpu --torch-backend=auto
#   pip install -e '.[gpu]'
gpu = [
    "torch",
    "transformers",
    "accelerate",
    "vllm",
    "autoawq",
]

[project.scripts]
llm-benchmark-serve = "llm_benchmark.serving.benchmark_serving:cli"
llm-benchmark-throughput = "llm_benchmark_offline.benchmark_throughput:cli"
llm-benchmark-latency = "llm_benchmark_offline.benchmark_latency:cli"

[tool.setuptools.package-data]
"llm_benchmark.serving" = ["sonnet.txt"]

[tool.setuptools.packages.find]
include = ["llm_benchmark*"]
