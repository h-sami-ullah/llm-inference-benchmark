[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Benchmark LLM inference optimizations (HuggingFace + vLLM OpenAI server)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "vllm",
    "autoawq",
    "openai",
    "requests",
    "pandas",
    "matplotlib",
    "numpy",
    "nvidia-ml-py3",
    "aiohttp",
    "huggingface-hub",
    "tqdm",
]

[project.scripts]
llm-benchmark-serve = "llm_benchmark.serving.benchmark_serving:cli"

[tool.setuptools.packages.find]
include = ["llm_benchmark*"]
