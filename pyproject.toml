[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Benchmark LLM inference optimizations (HuggingFace + vLLM OpenAI server)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "vllm",
    "autoawq",
    "openai",
    "requests",
    "pandas",
    "matplotlib",
    "numpy",
    "nvidia-ml-py3",
    "aiohttp",
    "huggingface-hub",
    "tqdm",
]

[project.scripts]
llm-benchmark-serve = "llm_benchmark.serving.benchmark_serving:cli"
llm-benchmark-throughput = "llm_benchmark_offline.benchmark_throughput:cli"
llm-benchmark-latency = "llm_benchmark_offline.benchmark_latency:cli"

[tool.setuptools.package-data]
"llm_benchmark.serving" = ["sonnet.txt"]

[tool.setuptools.packages.find]
include = ["llm_benchmark*"]
