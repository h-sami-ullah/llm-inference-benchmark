[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Benchmark LLM inference optimizations (HuggingFace + vLLM OpenAI server)"
readme = "README.md"
requires-python = ">=3.11"

# Light, portable dependencies only. GPU/CUDA packages (torch, vllm, ...) are
# intentionally NOT here: they need platform-specific CUDA wheels and would
# otherwise make `uv sync` / `pip install -e .` try to build them from source.
dependencies = [
    "requests",
    "openai",
    "aiohttp",
    "tqdm",
    "pandas",
    "numpy",
    "matplotlib",
    "nvidia-ml-py3",
    "huggingface-hub",
]

# NOTE: vLLM / PyTorch are intentionally NOT declared as Python dependencies.
# vLLM must be installed separately with a CUDA-aware torch backend
# (`uv pip install vllm --torch-backend=auto`), otherwise `uv sync`/pip tries
# to resolve a compatible vLLM wheel (or build one from source) and fails.

[tool.setuptools.packages.find]
include = ["llm_benchmark*"]
